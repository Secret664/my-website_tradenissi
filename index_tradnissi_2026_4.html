<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.4 トレード日誌</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="top-header">
  <div class="top-header-inner">
    <h1>📊 2026年4月 トレード管理</h1>
    <a href="temp/my_rule5.html" class="rule-link">
      📘 ルールを確認する
      <span class="mini">※エントリー前必須</span>
    </a>
  </div>
</header>

<div class="page-wrap">

  <!-- ===== サマリー ===== -->
  <div class="card">
    <p class="card-title">Monthly Summary</p>
    <div class="summary">
      <div class="summary-box">
        <span class="label">総 Pips</span>
        <span class="value" id="totalPips">—</span>
      </div>
      <div class="summary-box">
        <span class="label">勝率</span>
        <span class="value" id="winRate">—</span>
      </div>
      <div class="summary-box">
        <span class="label">平均 Pips</span>
        <span class="value" id="avgPips">—</span>
      </div>
      <div class="summary-box">
        <span class="label">最大 DD</span>
        <span class="value" id="maxDD">—</span>
      </div>
    </div>
    <div class="rank-row">
      <span class="rank-badge s">S <span id="countS">0</span></span>
      <span class="rank-badge a">A <span id="countA">0</span></span>
      <span class="rank-badge b">B <span id="countB">0</span></span>
      <span class="rank-badge c">C <span id="countC">0</span></span>
    </div>
  </div>

  <!-- ===== 資金推移グラフ ===== -->
  <div class="card">
    <p class="card-title">📈 資金推移（累積 Pips）</p>
    <div class="chart-box">
      <canvas id="equityChart"></canvas>
    </div>
  </div>

  <!-- ===== トレード履歴 ===== -->
  <div class="card">
    <p class="card-title">Trade History</p>

    <!--
      フィルター: ボタンをクリックして表示行を絞り込めます
      ● 全て / 勝ち（S・A評価） / 負け（B・C評価） / 🚨 要チェック
    -->
    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <button onclick="filterTable('all',  this)" class="active">● 全て</button>
      <button onclick="filterTable('win',  this)">✅ 勝ち</button>
      <button onclick="filterTable('loss', this)">❌ 負け</button>
      <button onclick="filterTable('check',this)">🚨 要注意</button>
      <span class="filter-hint">← クリックで絞り込み</span>
    </div>

    <div class="table-wrap">
      <table id="tradeTable">
        <thead>
          <tr>
            <th>日付 🔗</th>
            <th>通貨ペア</th>
            <th>方向</th>
            <th>Pips</th>
            <th>評価</th>
            <th>時間帯</th>
            <th>メモ</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <p style="margin:12px 0 0; font-size:11px; color:var(--text-muted);">
      🔗 日付をクリックすると詳細ページへ移動します
    </p>
  </div>

</div><!-- /.page-wrap -->

<script>
const files = [
  "nissi/20260401.html",
  "nissi/20260402.html"
];

let totalPips = 0;
let counts = { S:0, A:0, B:0, C:0 };
let totalTrades = 0, winTrades = 0;
const chartData = [], tableRows = [];

async function loadData() {
  const tbody = document.getElementById("tableBody");

  for (let file of files) {
    let res, text;
    try {
      res = await fetch(file);
      if (!res.ok) continue;
      text = await res.text();
    } catch(e) { console.warn("読み込み失敗:", file); continue; }

    const doc = new DOMParser().parseFromString(text, "text/html");
    const data = doc.querySelector(".trade-data");
    if (!data) { console.warn(".trade-data なし:", file); continue; }

    const date    = data.dataset.date;
    const pips    = parseFloat(data.dataset.pips);
    const rank    = data.dataset.rank;
    const comment = data.dataset.comment || "";
    const check   = data.dataset.check === "true";
    const pair    = data.dataset.pair    || "—";
    const dir     = data.dataset.dir     || "—";
    const session = data.dataset.session || "—";

    totalTrades++;
    totalPips += pips;
    if (counts[rank] !== undefined) counts[rank]++;
    if (rank === "S" || rank === "A") winTrades++;
    chartData.push({ date, pips });

    const dirClass = dir === "買い" ? "plus" : dir === "売り" ? "minus" : "neutral";

    const row = document.createElement("tr");
    row.dataset.type = check ? "check" : (pips >= 0 ? "win" : "loss");
    row.innerHTML = `
      <td class="${check ? 'check' : ''}">
        <a href="${file}" style="font-weight:700;">${date}</a>${check ? " 🚨" : ""}
      </td>
      <td style="font-weight:600; color:var(--text-primary);">${pair}</td>
      <td class="${dirClass}">${dir}</td>
      <td class="${pips >= 0 ? 'plus' : 'minus'}">${pips > 0 ? '+' : ''}${pips}</td>
      <td class="rank-${rank.toLowerCase()}">${rank}</td>
      <td style="font-size:12px; color:var(--text-muted);">${session}</td>
      <td class="memo">${comment}</td>
    `;
    tbody.appendChild(row);
    tableRows.push(row);
  }

  // サマリー
  const pipsEl = document.getElementById("totalPips");
  pipsEl.innerText = (totalPips > 0 ? "+" : "") + totalPips;
  pipsEl.style.color = totalPips >= 0 ? "var(--green)" : "var(--red)";

  document.getElementById("countS").innerText = counts.S;
  document.getElementById("countA").innerText = counts.A;
  document.getElementById("countB").innerText = counts.B;
  document.getElementById("countC").innerText = counts.C;

  document.getElementById("winRate").innerText =
    (totalTrades ? (winTrades / totalTrades * 100).toFixed(1) : 0) + "%";
  document.getElementById("avgPips").innerText =
    (totalTrades ? (totalPips / totalTrades).toFixed(1) : 0);

  drawChart();
}

function drawChart() {
  let cumulative = 0, peak = 0, maxDD = 0;
  const labels = [], equity = [], ptColors = [];

  chartData.forEach(d => {
    cumulative += d.pips;
    peak = Math.max(peak, cumulative);
    maxDD = Math.max(maxDD, peak - cumulative);
    labels.push(d.date);
    equity.push(+cumulative.toFixed(1));
    ptColors.push(d.pips >= 0 ? "#3fb950" : "#f85149");
  });

  document.getElementById("maxDD").innerText = maxDD.toFixed(1);

  new Chart(document.getElementById("equityChart"), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '累積Pips',
        data: equity,
        tension: 0.4,
        borderColor: "#58a6ff",
        backgroundColor: "rgba(88,166,255,0.07)",
        fill: true,
        pointBackgroundColor: ptColors,
        pointBorderColor: "#0d1117",
        pointBorderWidth: 2,
        pointRadius: 6,
        pointHoverRadius: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: "#8b949e", font: { size: 12 } } },
        tooltip: {
          backgroundColor: "#161b22",
          borderColor: "#30363d",
          borderWidth: 1,
          titleColor: "#e6edf3",
          bodyColor: "#8b949e"
        }
      },
      scales: {
        x: {
          ticks: { color: "#8b949e", font: { size: 12 } },
          grid:  { color: "#1c2128" }
        },
        y: {
          ticks: { color: "#8b949e", font: { size: 12 } },
          grid:  { color: "#1c2128" }
        }
      }
    }
  });
}

function filterTable(type, btn) {
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tableRows.forEach(row => {
    row.style.display = (type === "all" || row.dataset.type === type) ? "" : "none";
  });
}

loadData();
</script>

</body>
</html>
