var ci=-1,selCats=new Set(),adds=[],favs=new Set(),ovr={},dels=new Set(),fav_=false,fp=false,editing=null;

function loadS(){
  try{const r=localStorage.getItem('fx4_adds');if(r)adds=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem('fx4_favs');if(r)favs=new Set(JSON.parse(r));}catch(e){}
  try{const r=localStorage.getItem('fx4_ovr');if(r)ovr=JSON.parse(r);}catch(e){}
  try{const r=localStorage.getItem('fx4_dels');if(r)dels=new Set(JSON.parse(r));}catch(e){}
}
function sv_a(){try{localStorage.setItem('fx4_adds',JSON.stringify(adds));}catch(e){}}
function sv_f(){try{localStorage.setItem('fx4_favs',JSON.stringify([...favs]));}catch(e){}}
function sv_o(){try{localStorage.setItem('fx4_ovr',JSON.stringify(ovr));}catch(e){}}
function sv_d(){try{localStorage.setItem('fx4_dels',JSON.stringify([...dels]));}catch(e){}}

function bk(ci,vid,t){return ci+'|'+(vid||'T:'+String(t).slice(0,16));}
function ak(id){return'A:'+id;}
function cn(i,c){return(CATS[i]||{})[c]||'';}
function yu(id){if(!id)return'';if(id.startsWith('http'))return id;if(id==='pL-L9CDDCZo')return'https://www.youtube.com/watch?v='+id;return'https://youtu.be/'+id;}
function bdg(cat){if(!cat)return'';const c=CC[cat]||['#F1EFE8','#444441'];return`<span class="bdg" style="background:${c[0]};color:${c[1]}">${cat}</span>`;}
function cbdg(idx){const c=CHBDG[idx];return`<span class="bdg" style="background:${c[0]};color:${c[1]}">${CHAPTERS[idx].title}</span>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function gT(key,r){return ovr[key]?.t??r[1];}
function gD(key,r){return ovr[key]?.d??r[0];}
function baseRows(chIdx){return CHAPTERS[chIdx].data.filter(r=>{const k=bk(chIdx,r[2],r[1]);return!dels.has(k);}).map(r=>({r,chIdx,added:false,id:null,key:bk(chIdx,r[2],r[1])}));}
function addRows(chIdx){return adds.filter(a=>a.ci===chIdx).map(a=>({r:a.row,chIdx,added:true,id:a.id,key:ak(a.id)}));}
function chRows(chIdx){return[...baseRows(chIdx),...addRows(chIdx)];}
function allRows(){return[0,1,2,3].flatMap(i=>chRows(i));}
function filterRows(rows){const q=document.getElementById('gsq').value.toLowerCase();return rows.filter(({r,chIdx,key})=>{const cat=cn(chIdx,r[3]||'');if(fav_&&!favs.has(key))return false;if(ci>=0&&selCats.size&&!selCats.has(cat))return false;if(!q)return true;return(String(gD(key,r))+gT(key,r)+r[2]+cat+CHAPTERS[chIdx].title).toLowerCase().includes(q);});}
function drawTabs(){document.getElementById('tabs').innerHTML=[['全章','すべて'],...CHAPTERS.map(c=>[c.title,c.sub])].map((t,i)=>{const idx=i-1;return`<button class="tab${ci===idx?' on':''}" onclick="setTab(${idx})">${t[0]}<br><span style="font-size:10px;opacity:.7">${t[1]}</span></button>`;}).join('');}
function drawPills(){const el=document.getElementById('pills');if(ci<0){el.innerHTML='';return;}const cats=[...new Set(chRows(ci).map(({r})=>cn(ci,r[3]||'')).filter(Boolean))];el.innerHTML=cats.map(cat=>{const on=selCats.has(cat);const c=CC[cat]||['#F1EFE8','#444441'];return`<span class="pill${on?' pon':''}" data-action="pill" data-cat="${cat}" style="${on?`background:${c[0]};color:${c[1]};border-color:${c[0]}`:''}">${cat}</span>`;}).join('');}

function render(){
  const isAll=ci<0;const src=isAll?allRows():chRows(ci);const rows=filterRows(src);const tot=(isAll?allRows():chRows(ci)).length;
  document.getElementById('st').textContent=`${rows.length}件 / 全${tot}件　♥ ${favs.size}件`;
  const isNum=!isAll&&CHAPTERS[ci].type==='numbered';
  let hdr='';
  if(isAll){hdr='<tr><th style="width:3%"></th><th style="width:6%">章</th><th style="width:12%">日付/No.</th><th style="width:43%">タイトル</th><th style="width:12%">YouTube</th><th style="width:16%">カテゴリ</th><th style="width:8%"></th></tr>';}
  else if(isNum){hdr='<tr><th style="width:3%"></th><th style="width:6%">No.</th><th style="width:56%">タイトル</th><th style="width:12%">YouTube</th><th style="width:15%">カテゴリ</th><th style="width:8%"></th></tr>';}
  else{hdr='<tr><th style="width:3%"></th><th style="width:13%">日付</th><th style="width:48%">タイトル</th><th style="width:12%">YouTube</th><th style="width:16%">カテゴリ</th><th style="width:8%"></th></tr>';}
  const body=rows.map(({r,chIdx,added,id,key})=>{
    const vid=r[2];const cat=cn(chIdx,r[3]||'');const isFav=favs.has(key);const isEditing=editing&&editing.key===key;
    const fvBtn=`<td style="text-align:center"><button class="fv${isFav?' on':''}" data-action="fav" data-key="${key}">${isFav?'♥':'♡'}</button></td>`;
    const isN=CHAPTERS[chIdx].type==='numbered';
    if(isEditing){
      const tt=esc(gT(key,r));const dd=esc(gD(key,r));
      const extra=isAll?`<td>${cbdg(chIdx)}</td>`:'';
      return`<tr class="erow">${fvBtn}${extra}<td style="vertical-align:top"><input id="ed_d" value="${dd}" placeholder="${isN?'No.':'日付'}" style="width:100%"></td><td style="vertical-align:top"><input id="ed_t" value="${tt}" placeholder="タイトル" style="width:100%"><div style="margin-top:3px;display:flex;gap:3px"><button class="esv" data-action="save">保存</button><button class="ecl" data-action="cancel">取消</button></div></td><td></td><td></td><td></td></tr>`;
    }
    const title=gT(key,r);const date=gD(key,r);
    const dispDate=isN?String(date):(String(date||'').replace(/-/g,'/')||'—');
    const link=vid?`<a href="${yu(vid)}" target="_blank">${vid.startsWith('http')?'Vimeo↗':vid.slice(0,9)+'↗'}</a>`:'—';
    const actns=`<td><span class="act"><button class="epn" data-action="edit" data-key="${key}" data-ci="${chIdx}" data-added="${added}" data-id="${id||''}">✎</button><button class="xb" data-action="del" data-key="${key}" data-added="${added}" data-id="${id||''}">削除</button></span></td>`;
    const chCol=isAll?`<td>${cbdg(chIdx)}</td>`:'';
    return`<tr>${fvBtn}${chCol}<td style="color:#888;font-size:11px;white-space:nowrap">${dispDate}</td><td>${title}</td><td>${link}</td><td>${bdg(cat)}</td>${actns}</tr>`;
  }).join('');
  document.getElementById('th').innerHTML=hdr;
  document.getElementById('tb').innerHTML=body;
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-action]');if(!el)return;
  const act=el.dataset.action;
  if(act==='fav'){const k=el.dataset.key;favs.has(k)?favs.delete(k):favs.add(k);sv_f();updateFavBtn();render();}
  else if(act==='edit'){const k=el.dataset.key;const chIdx=parseInt(el.dataset.ci);const item=(chIdx>=0?chRows(chIdx):allRows()).find(x=>x.key===k)||allRows().find(x=>x.key===k);if(item){editing={key:k,chIdx:item.chIdx,r:item.r,added:item.added,addId:item.id};render();}}
  else if(act==='save'){if(!editing)return;const t=(document.getElementById('ed_t')||{}).value?.trim();const d=(document.getElementById('ed_d')||{}).value?.trim();if(editing.added){const a=adds.find(x=>x.id===editing.addId);if(a){if(t!==undefined)a.row[1]=t;if(d!==undefined)a.row[0]=d;sv_a();}}else{if(!ovr[editing.key])ovr[editing.key]={};if(t!==undefined)ovr[editing.key].t=t;if(d!==undefined)ovr[editing.key].d=d;sv_o();}editing=null;render();}
  else if(act==='cancel'){editing=null;render();}
  else if(act==='del'){if(!confirm('この項目を削除しますか？'))return;const k=el.dataset.key;const isAdded=el.dataset.added==='true';const addId=el.dataset.id;if(isAdded){adds=adds.filter(a=>a.id!==addId);sv_a();}else{dels.add(k);sv_d();}editing=null;drawPills();render();}
  else if(act==='pill'){const cat=el.dataset.cat;selCats.has(cat)?selCats.delete(cat):selCats.add(cat);drawPills();render();}
});

function setTab(idx){ci=idx;selCats=new Set();editing=null;drawTabs();drawPills();render();}
function updateFavBtn(){const n=favs.size;const b=document.getElementById('favbtn');b.textContent=fav_?`♥ お気に入り(${n})`:`♡ お気に入り${n?'('+n+')':''}`;}
function toggleFF(){fav_=!fav_;document.getElementById('favbtn').classList.toggle('fon',fav_);updateFavBtn();render();}
function toggleForm(){fp=!fp;document.getElementById('af').style.display=fp?'block':'none';document.getElementById('addbtn').textContent=fp?'× 閉じる':'＋ 追加';document.getElementById('ferr').textContent='';if(fp)upCats();}
function onCC(){const idx=parseInt(document.getElementById('f-ch').value);const isN=CHAPTERS[idx].type==='numbered';document.getElementById('f-dlbl').textContent=isN?'No.':'日付';document.getElementById('f-d').placeholder=isN?'例: 32':'例: 2026/04/21';upCats();}
function upCats(){const idx=parseInt(document.getElementById('f-ch').value);document.getElementById('f-cat').innerHTML=Object.entries(CATS[idx]).filter(([k,v])=>v).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');}
function submitForm(){
  const chIdx=parseInt(document.getElementById('f-ch').value);const t=document.getElementById('f-t').value.trim();const errEl=document.getElementById('ferr');
  if(!t){errEl.style.color='#c44';errEl.textContent='タイトルを入力してください';return;}
  const d=document.getElementById('f-d').value.trim();const u=document.getElementById('f-u').value.trim();const cat=document.getElementById('f-cat').value;
  const vid=u?(u.startsWith('http')?u:(u.match(/(?:youtu\.be\/|[?&]v=)([\w\-]+)/)||[,''])[1]):'';
  const isN=CHAPTERS[chIdx].type==='numbered';const row=isN?[parseInt(d)||'',t,vid,cat]:[d,t,vid,cat];
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,4);adds.push({id,ci:chIdx,row});sv_a();
  document.getElementById('f-t').value='';document.getElementById('f-d').value='';document.getElementById('f-u').value='';
  errEl.style.color='green';errEl.textContent='登録しました！';setTimeout(()=>{errEl.textContent='';},2000);drawPills();render();
}

loadS();updateFavBtn();document.getElementById('gsq').oninput=()=>render();upCats();drawTabs();drawPills();render();
</script>
