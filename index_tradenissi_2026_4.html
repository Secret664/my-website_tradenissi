<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.4 トレード日誌</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="top-header">
  <div class="top-header-inner">
    <h1>📊 2026年4月 トレード管理</h1>
    <a href="temp/my_rule5.html" class="rule-link">
      📘 ルールを確認する
      <span class="mini">※エントリー前必須</span>
    </a>
  </div>
</header>

<div class="page-wrap">

  <section class="card">
    <h2>月間サマリー</h2>
    <div class="summary">
      <div class="summary-box">総Pips<span id="totalPips">-</span></div>
      <div class="summary-box">勝率<span id="winRate">-</span></div>
      <div class="summary-box">平均<span id="avgPips">-</span></div>
      <div class="summary-box">最大DD<span id="maxDD">-</span></div>
    </div>
    <p style="margin: 14px 0 0; font-size: 14px;">
      S：<span id="countS" class="rank-s">0</span> &nbsp;
      A：<span id="countA" class="rank-a">0</span> &nbsp;
      B：<span id="countB" class="rank-b">0</span> &nbsp;
      C：<span id="countC" class="rank-c">0</span>
    </p>
  </section>

  <section class="card">
    <h2>📈 資金推移（累積Pips）</h2>
    <div class="chart-box">
      <canvas id="equityChart"></canvas>
    </div>
  </section>

  <section class="card">
    <h2>トレード履歴</h2>
    <div class="filter">
      <button onclick="filterTable('all', this)" class="active">全て</button>
      <button onclick="filterTable('win', this)">勝ち</button>
      <button onclick="filterTable('loss', this)">負け</button>
      <button onclick="filterTable('check', this)">🚨 要注意</button>
    </div>
    <table id="tradeTable">
      <tr>
        <th>日付</th><th>Pips</th><th>評価</th><th>メモ</th>
      </tr>
    </table>
  </section>

  <section class="card">
    <h2>リンク</h2>
    <ul style="padding-left: 18px; line-height: 2.2;">
      <li><a href="nissi/20260401.html">2026-04-01</a></li>
      <li><a href="nissi/20260402.html">2026-04-02</a></li>
      <li><a href="nissi/20260403.html">2026-03-03</a></li>
      <li><a href="temp/my_rule5.html">📘 ルールページ</a></li>
    </ul>
  </section>

</div>

<script>
const files = [
  "nissi/20260401.html",
  "nissi/20260402.html",
  "nissi/20260403.html"
];

let totalPips = 0;
let counts = { S:0, A:0, B:0, C:0 };
let totalTrades = 0, winTrades = 0;
const chartData = [], tableRows = [];

async function loadData() {
  const table = document.getElementById("tradeTable");

  for (let file of files) {
    let res, text;
    try {
      res = await fetch(file);
      if (!res.ok) continue;
      text = await res.text();
    } catch(e) { console.warn("読み込み失敗:", file); continue; }

    const doc = new DOMParser().parseFromString(text, "text/html");
    const data = doc.querySelector(".trade-data");
    if (!data) { console.warn(".trade-data なし:", file); continue; }

    const date    = data.dataset.date;
    const pips    = parseFloat(data.dataset.pips);
    const rank    = data.dataset.rank;
    const comment = data.dataset.comment || "";
    const check   = data.dataset.check === "true";

    totalTrades++;
    totalPips += pips;
    if (counts[rank] !== undefined) counts[rank]++;
    if (rank === "S" || rank === "A") winTrades++;
    chartData.push({ date, pips });

    const row = document.createElement("tr");
    row.dataset.type = check ? "check" : (pips >= 0 ? "win" : "loss");
    row.innerHTML = `
      <td class="${check ? 'check' : ''}">
        <a href="${file}">${date}</a>${check ? " 🚨" : ""}
      </td>
      <td class="${pips >= 0 ? 'plus' : 'minus'}">${pips > 0 ? '+' : ''}${pips}</td>
      <td class="rank-${rank.toLowerCase()}">${rank}</td>
      <td class="memo">${comment}</td>
    `;
    table.appendChild(row);
    tableRows.push(row);
  }

  const pipsEl = document.getElementById("totalPips");
  pipsEl.innerText = (totalPips > 0 ? "+" : "") + totalPips;
  pipsEl.style.color = totalPips >= 0 ? "#3fb950" : "#f85149";

  document.getElementById("countS").innerText = counts.S;
  document.getElementById("countA").innerText = counts.A;
  document.getElementById("countB").innerText = counts.B;
  document.getElementById("countC").innerText = counts.C;
  document.getElementById("winRate").innerText =
    (totalTrades ? (winTrades / totalTrades * 100).toFixed(1) : 0) + "%";
  document.getElementById("avgPips").innerText =
    (totalTrades ? (totalPips / totalTrades).toFixed(1) : 0);

  drawChart();
}

function drawChart() {
  let cumulative = 0, peak = 0, maxDD = 0;
  const labels = [], equity = [], ptColors = [];

  chartData.forEach(d => {
    cumulative += d.pips;
    peak = Math.max(peak, cumulative);
    maxDD = Math.max(maxDD, peak - cumulative);
    labels.push(d.date);
    equity.push(cumulative);
    ptColors.push(d.pips >= 0 ? "#3fb950" : "#f85149");
  });

  document.getElementById("maxDD").innerText = maxDD;

  new Chart(document.getElementById("equityChart"), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '累積Pips',
        data: equity,
        tension: 0.3,
        borderColor: "#58a6ff",
        backgroundColor: "rgba(88,166,255,0.08)",
        fill: true,
        pointBackgroundColor: ptColors,
        pointRadius: 5,
        pointHoverRadius: 7
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: "#8b949e" } } },
      scales: {
        x: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } },
        y: { ticks: { color: "#8b949e" }, grid: { color: "#21262d" } }
      }
    }
  });
}

function filterTable(type, btn) {
  document.querySelectorAll('.filter button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  tableRows.forEach(row => {
    row.style.display = (type === "all" || row.dataset.type === type) ? "" : "none";
  });
}

loadData();
</script>

</body>
</html>
