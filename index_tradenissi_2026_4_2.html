<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.4 トレード日誌</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header class="top-header">
  <h1>📊 2026年4月 トレード管理</h1>
  <a href="temp/my_rule5.html" class="rule-link">
    📘 ルールを確認する（最重要）
    <span class="mini">※エントリー前必須</span>
  </a>
</header>

<!-- ===== サマリー ===== -->
<div class="card">
  <h2>月間サマリー</h2>
  <div class="summary">
    <div class="summary-box">総Pips<span id="totalPips">-</span></div>
    <div class="summary-box">勝率<span id="winRate">-</span></div>
    <div class="summary-box">平均<span id="avgPips">-</span></div>
    <div class="summary-box">最大DD<span id="maxDD">-</span></div>
  </div>
  <p style="margin:8px 0 0 0; font-size:13px;">
    S: <span id="countS" class="rank-s">0</span> &nbsp;
    A: <span id="countA" class="rank-a">0</span> &nbsp;
    B: <span id="countB" class="rank-b">0</span> &nbsp;
    C: <span id="countC" class="rank-c">0</span>
  </p>
</div>

<!-- ===== グラフ ===== -->
<div class="card">
  <h2>📈 資金推移（累積Pips）</h2>
  <div class="chart-box">
    <!-- ★ IDを equityChart に統一（旧コードは pipsChart と食い違っていた） -->
    <canvas id="equityChart"></canvas>
  </div>
</div>

<!-- ===== テーブル ===== -->
<div class="card">
  <h2>トレード履歴</h2>
  <div class="filter">
    <button onclick="filterTable('all')">全て</button>
    <button onclick="filterTable('win')">勝ち</button>
    <button onclick="filterTable('loss')">負け</button>
    <button onclick="filterTable('check')">🚨 要確認</button>
  </div>
  <table id="tradeTable">
    <tr>
      <th>日付</th>
      <th>Pips</th>
      <th>評価</th>
      <th>メモ</th>
    </tr>
  </table>
</div>

<!-- ===== リンク ===== -->
<div class="card">
  <h2>リンク</h2>
  <ul>
    <li><a href="nissi/20260401.html">2026-04-01</a></li>
    <li><a href="nissi/20260402.html">2026-04-02</a></li>
    <li><a href="temp/my_rule5.html">ルールページ</a></li>
  </ul>
</div>

<script>
// ===== 読み込む日誌ファイルリスト =====
const files = [
  "nissi/20260401.html",
  "nissi/20260402.html"
];

let totalPips = 0;
let counts = { S:0, A:0, B:0, C:0 };
let totalTrades = 0;
let winTrades = 0;
const chartData = [];
const tableRows = [];

async function loadData() {
  const table = document.getElementById("tradeTable");

  for (let file of files) {
    let res, text;
    try {
      res = await fetch(file);
      if (!res.ok) continue;
      text = await res.text();
    } catch(e) {
      console.warn("fetch失敗:", file, e);
      continue;
    }

    const doc = new DOMParser().parseFromString(text, "text/html");
    const data = doc.querySelector(".trade-data");
    if (!data) {
      console.warn(".trade-data が見つかりません:", file);
      continue;
    }

    const date    = data.dataset.date    || "不明";
    const pips    = parseFloat(data.dataset.pips) || 0;
    const rank    = data.dataset.rank    || "C";
    const comment = data.dataset.comment || "";
    const check   = data.dataset.check   === "true";

    totalTrades++;
    totalPips += pips;
    if (counts[rank] !== undefined) counts[rank]++;
    if (rank === "S" || rank === "A") winTrades++;
    chartData.push({ date, pips });

    const row = document.createElement("tr");
    row.dataset.type = check ? "check" : (pips >= 0 ? "win" : "loss");

    row.innerHTML = `
      <td class="${check ? 'check' : ''}">
        <a href="${file}">${date}</a>${check ? " 🚨" : ""}
      </td>
      <td class="${pips >= 0 ? 'plus' : 'minus'}">${pips > 0 ? '+' : ''}${pips}</td>
      <td class="rank-${rank.toLowerCase()}">${rank}</td>
      <td class="memo">${comment}</td>
    `;
    table.appendChild(row);
    tableRows.push(row);
  }

  // サマリー更新
  document.getElementById("totalPips").innerText =
    (totalPips > 0 ? "+" : "") + totalPips;
  document.getElementById("countS").innerText = counts.S;
  document.getElementById("countA").innerText = counts.A;
  document.getElementById("countB").innerText = counts.B;
  document.getElementById("countC").innerText = counts.C;
  document.getElementById("winRate").innerText =
    (totalTrades ? (winTrades / totalTrades * 100).toFixed(1) : 0) + "%";
  document.getElementById("avgPips").innerText =
    (totalTrades ? (totalPips / totalTrades).toFixed(1) : 0);

  drawChart();
}

function drawChart() {
  let cumulative = 0, peak = 0, maxDD = 0;
  const labels = [], equity = [];

  chartData.forEach(d => {
    cumulative += d.pips;
    peak = Math.max(peak, cumulative);
    maxDD = Math.max(maxDD, peak - cumulative);
    labels.push(d.date);
    equity.push(cumulative);
  });

  document.getElementById("maxDD").innerText = maxDD;

  // ★ getElementById("equityChart") に統一
  new Chart(document.getElementById("equityChart"), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [{
        label: '累積Pips',
        data: equity,
        borderColor: equity[equity.length - 1] >= 0 ? '#3fb950' : '#f85149',
        backgroundColor: 'rgba(63,185,80,0.08)',
        tension: 0.3,
        fill: true,
        pointRadius: 5,
        pointHoverRadius: 7
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#c9d1d9' } }
      },
      scales: {
        x: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#21262d' } }
      }
    }
  });
}

function filterTable(type) {
  tableRows.forEach(row => {
    row.style.display =
      type === "all" || row.dataset.type === type ? "" : "none";
  });
}

loadData();
</script>

</body>
</html>
